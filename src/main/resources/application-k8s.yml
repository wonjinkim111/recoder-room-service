server:
  port: 20000

spring:
  application:
    name: room-service

  devtools:
    restart:
      enabled: true

  datasource:
    url: jdbc:mysql://mysql:3306/room?serverTimezone=UTC&characterEncoding=UTF-8&allowMultiQueries=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL5InnoDBDialect

  cloud:
    kubernetes:
      discovery:
        enabled: true
        all-namespaces: true
    loadbalancer:
      ribbon:
        enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 215MB

feign:
  hystrix:
    enabled: false

file:
  upload-dir: /usr/recoder-img

mybatis:
  type-aliases-package: com.yaas.recoderroomservice.entity
  mapper-locations: mapper/**/*.xml

token:
  expiration_time: 86400000
  secret: recoder_secret

authorization:
  token:
    header:
      name: Authorization
      prefix: Bearer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  security:
    enabled: false
